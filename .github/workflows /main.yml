name: Build BikeTurbo ASI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile
        shell: pwsh
        run: |
          $src = Get-ChildItem -Recurse -Filter BikeTurbo.cpp | Select-Object -First 1
          if (-not $src) { throw "BikeTurbo.cpp nao encontrado" }
          Set-Location $src.DirectoryName
          cl /nologo /LD /O2 /MT /EHsc BikeTurbo.cpp /Fe:BikeTurbo.asi /link /DYNAMICBASE:NO user32.lib
          if ($LASTEXITCODE -ne 0) { throw "Falha na compilacao" }

      - uses: actions/upload-artifact@v4
        with:
          name: BikeTurbo
          path: |
            **/BikeTurbo.asi
            **/BikeTurbo.ini
