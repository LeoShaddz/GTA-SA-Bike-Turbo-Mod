[BikeTurbo]
; 1 = enabled, 0 = disabled
Enable = 1

; Code used to toggle the turbo on/off by typing it during gameplay (letters A-Z only)
Code = BIKETURBO

; Messages displayed in the game's help box (the same one used by cheats, with the same sound)
TextOn  = Bike Turbo On
TextOff = Bike Turbo Off

; Tap speed: how many game frames the button stays pressed and then released.
; 1 = fastest (about 15 taps per second at 30 FPS), 2 = about 7, 3 = about 5...
; If the bicycle does not accelerate, try 2 or 3 (some games require slower taps).
TapFrames = 1

; 1 = turbo starts enabled when the game launches
StartEnabled = 0

; 1 = generates BikeTurbo.log next to the .asi file (diagnostics)
Log = 0
